<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Outer glow rings -->
  <circle cx="100" cy="88" r="72" fill="none" stroke="white" stroke-width="1.5" opacity="0.2"/>
  <circle cx="100" cy="88" r="56" fill="none" stroke="white" stroke-width="1.5" opacity="0.28"/>
  <!-- Large eye outline -->
  <path d="M20,88 Q60,30 100,30 Q140,30 180,88 Q140,146 100,146 Q60,146 20,88 Z"
        fill="none" stroke="white" stroke-width="4" opacity="0.9"/>
  <!-- Inner iris circle -->
  <circle cx="100" cy="88" r="32" fill="rgba(255,255,255,0.25)" stroke="white" stroke-width="3" opacity="0.85"/>
  <!-- Pupil -->
  <circle cx="100" cy="88" r="16" fill="white" opacity="0.88"/>
  <!-- Eye highlight -->
  <circle cx="108" cy="82" r="5" fill="rgba(255,255,255,0.5)"/>
  <!-- Rays emanating from the eye (divine omniscience) -->
  <line x1="100" y1="18" x2="100" y2="8" stroke="white" stroke-width="2.5" opacity="0.55"/>
  <line x1="140" y1="30" x2="147" y2="23" stroke="white" stroke-width="2" opacity="0.45"/>
  <line x1="60" y1="30" x2="53" y2="23" stroke="white" stroke-width="2" opacity="0.45"/>
  <line x1="175" y1="72" x2="185" y2="68" stroke="white" stroke-width="1.8" opacity="0.4"/>
  <line x1="25" y1="72" x2="15" y2="68" stroke="white" stroke-width="1.8" opacity="0.4"/>
  <line x1="175" y1="104" x2="185" y2="108" stroke="white" stroke-width="1.8" opacity="0.4"/>
  <line x1="25" y1="104" x2="15" y2="108" stroke="white" stroke-width="1.8" opacity="0.4"/>
  <!-- Cloud / sky below -->
  <ellipse cx="55" cy="168" rx="32" ry="12" fill="rgba(255,255,255,0.25)"/>
  <ellipse cx="100" cy="172" rx="42" ry="10" fill="rgba(255,255,255,0.2)"/>
  <ellipse cx="145" cy="168" rx="32" ry="12" fill="rgba(255,255,255,0.25)"/>
  <!-- Small stars at corners -->
  <circle cx="22" cy="148" r="2" fill="white" opacity="0.5"/>
  <circle cx="178" cy="148" r="2" fill="white" opacity="0.5"/>
</svg>
