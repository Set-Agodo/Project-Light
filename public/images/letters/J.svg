<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Light rays from above -->
  <line x1="100" y1="10" x2="100" y2="40" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="100" y1="10" x2="78" y2="38" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <line x1="100" y1="10" x2="122" y2="38" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <!-- Left tablet -->
  <rect x="22" y="48" width="70" height="95" rx="10" ry="35" fill="white" opacity="0.88"/>
  <!-- Right tablet -->
  <rect x="108" y="48" width="70" height="95" rx="10" ry="35" fill="white" opacity="0.88"/>
  <!-- Lines on left tablet (commandments 1-5) -->
  <line x1="35" y1="78" x2="79" y2="78" stroke="rgba(0,0,0,0.2)" stroke-width="2.5"/>
  <line x1="35" y1="92" x2="79" y2="92" stroke="rgba(0,0,0,0.2)" stroke-width="2.5"/>
  <line x1="35" y1="106" x2="79" y2="106" stroke="rgba(0,0,0,0.2)" stroke-width="2.5"/>
  <line x1="35" y1="120" x2="79" y2="120" stroke="rgba(0,0,0,0.2)" stroke-width="2.5"/>
  <line x1="35" y1="134" x2="79" y2="134" stroke="rgba(0,0,0,0.2)" stroke-width="2.5"/>
  <!-- Lines on right tablet (commandments 6-10) -->
  <line x1="121" y1="78" x2="165" y2="78" stroke="rgba(0,0,0,0.2)" stroke-width="2.5"/>
  <line x1="121" y1="92" x2="165" y2="92" stroke="rgba(0,0,0,0.2)" stroke-width="2.5"/>
  <line x1="121" y1="106" x2="165" y2="106" stroke="rgba(0,0,0,0.2)" stroke-width="2.5"/>
  <line x1="121" y1="120" x2="165" y2="120" stroke="rgba(0,0,0,0.2)" stroke-width="2.5"/>
  <line x1="121" y1="134" x2="165" y2="134" stroke="rgba(0,0,0,0.2)" stroke-width="2.5"/>
  <!-- Roman numerals on top (I–V and VI–X) -->
  <text x="57" y="70" text-anchor="middle" font-size="11" fill="rgba(0,0,0,0.25)" font-family="serif">I–V</text>
  <text x="143" y="70" text-anchor="middle" font-size="11" fill="rgba(0,0,0,0.25)" font-family="serif">VI–X</text>
  <!-- Ground / rocks -->
  <ellipse cx="57" cy="155" rx="48" ry="12" fill="rgba(255,255,255,0.2)"/>
  <ellipse cx="143" cy="155" rx="48" ry="12" fill="rgba(255,255,255,0.2)"/>
</svg>
