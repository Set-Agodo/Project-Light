  <ellipse cx="70" cy="120" rx="32" ry="20" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
  <ellipse cx="130" cy="120" rx="32" ry="20" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
