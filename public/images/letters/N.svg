<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Glow / light behind door -->
  <ellipse cx="100" cy="100" rx="55" ry="75" fill="rgba(255,255,255,0.18)"/>
  <ellipse cx="100" cy="100" rx="38" ry="58" fill="rgba(255,255,255,0.22)"/>
  <!-- Door frame -->
  <rect x="58" y="42" width="84" height="130" rx="8" fill="none" stroke="white" stroke-width="5" opacity="0.9"/>
  <!-- Door arch at top -->
  <path d="M58,70 Q58,42 100,42 Q142,42 142,70" fill="none" stroke="white" stroke-width="5" opacity="0.9"/>
  <!-- Door panels (subtle) -->
  <rect x="67" y="80" width="28" height="38" rx="4" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <rect x="105" y="80" width="28" height="38" rx="4" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <rect x="67" y="126" width="28" height="38" rx="4" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <rect x="105" y="126" width="28" height="38" rx="4" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <!-- Door knob -->
  <circle cx="134" cy="107" r="5" fill="white" opacity="0.85"/>
  <!-- Light rays streaming outward from door -->
  <line x1="100" y1="42" x2="100" y2="18" stroke="white" stroke-width="2.5" opacity="0.5"/>
  <line x1="100" y1="42" x2="74" y2="22" stroke="white" stroke-width="1.8" opacity="0.4"/>
  <line x1="100" y1="42" x2="126" y2="22" stroke="white" stroke-width="1.8" opacity="0.4"/>
  <line x1="58" y1="100" x2="30" y2="88" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <line x1="142" y1="100" x2="170" y2="88" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <!-- Stars around -->
  <circle cx="30" cy="35" r="2.5" fill="white" opacity="0.6"/>
  <circle cx="170" cy="30" r="2" fill="white" opacity="0.55"/>
  <circle cx="22" cy="120" r="1.8" fill="white" opacity="0.5"/>
  <circle cx="178" cy="115" r="1.8" fill="white" opacity="0.5"/>
</svg>
