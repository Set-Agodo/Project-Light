<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background glow -->
  <circle cx="100" cy="90" r="70" fill="rgba(255,255,255,0.1)"/>
  <!-- Throne base / steps -->
  <rect x="20" y="158" width="160" height="16" rx="4" fill="white" opacity="0.5"/>
  <rect x="34" y="142" width="132" height="18" rx="4" fill="white" opacity="0.6"/>
  <rect x="48" y="125" width="104" height="19" rx="4" fill="white" opacity="0.7"/>
  <!-- Throne seat -->
  <rect x="58" y="88" width="84" height="38" rx="6" fill="white" opacity="0.85"/>
  <!-- Throne back -->
  <rect x="62" y="36" width="76" height="56" rx="8" fill="white" opacity="0.88"/>
  <!-- Throne top arch decoration -->
  <path d="M62,62 Q100,28 138,62" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>
  <!-- Crown on top of throne -->
  <path d="M72,36 L72,22 L82,30 L100,18 L118,30 L128,22 L128,36 Z" fill="white" opacity="0.92"/>
  <!-- Crown jewel dots -->
  <circle cx="100" cy="22" r="4" fill="rgba(255,255,255,0.6)"/>
  <circle cx="82" cy="28" r="3" fill="rgba(255,255,255,0.5)"/>
  <circle cx="118" cy="28" r="3" fill="rgba(255,255,255,0.5)"/>
  <!-- Armrests -->
  <rect x="48" y="92" width="18" height="28" rx="4" fill="white" opacity="0.78"/>
  <rect x="134" y="92" width="18" height="28" rx="4" fill="white" opacity="0.78"/>
  <!-- Scepter -->
  <line x1="116" y1="68" x2="116" y2="118" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <circle cx="116" cy="64" r="6" fill="white" opacity="0.85"/>
  <!-- Rays from throne -->
  <line x1="100" y1="36" x2="88" y2="20" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="36" x2="112" y2="20" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <line x1="58" y1="68" x2="42" y2="60" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <line x1="142" y1="68" x2="158" y2="60" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <!-- Stars -->
  <circle cx="28" cy="28" r="2.5" fill="white" opacity="0.6"/>
  <circle cx="172" cy="28" r="2.5" fill="white" opacity="0.6"/>
  <circle cx="18" cy="90" r="2" fill="white" opacity="0.5"/>
  <circle cx="182" cy="90" r="2" fill="white" opacity="0.5"/>
</svg>
