<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Altar base / stones -->
  <rect x="30" y="145" width="140" height="20" rx="4" fill="white" opacity="0.75"/>
  <rect x="40" y="130" width="120" height="18" rx="4" fill="white" opacity="0.8"/>
  <rect x="50" y="115" width="100" height="18" rx="4" fill="white" opacity="0.85"/>
  <!-- Stone texture lines -->
  <line x1="80" y1="130" x2="80" y2="148" stroke="rgba(0,0,0,0.12)" stroke-width="2"/>
  <line x1="110" y1="130" x2="110" y2="148" stroke="rgba(0,0,0,0.12)" stroke-width="2"/>
  <line x1="140" y1="130" x2="140" y2="148" stroke="rgba(0,0,0,0.12)" stroke-width="2"/>
  <line x1="90" y1="115" x2="90" y2="130" stroke="rgba(0,0,0,0.1)" stroke-width="2"/>
  <line x1="120" y1="115" x2="120" y2="130" stroke="rgba(0,0,0,0.1)" stroke-width="2"/>
  <!-- Wood / offering on altar -->
  <rect x="60" y="104" width="80" height="14" rx="3" fill="white" opacity="0.7"/>
  <line x1="78" y1="104" x2="78" y2="118" stroke="rgba(0,0,0,0.1)" stroke-width="2"/>
  <line x1="100" y1="104" x2="100" y2="118" stroke="rgba(0,0,0,0.1)" stroke-width="2"/>
  <line x1="122" y1="104" x2="122" y2="118" stroke="rgba(0,0,0,0.1)" stroke-width="2"/>
  <!-- Main fire column -->
  <path d="M80,104 Q72,85 78,62 Q82,44 100,28 Q118,44 122,62 Q128,85 120,104 Z"
        fill="white" opacity="0.92"/>
  <!-- Fire inner column (brighter) -->
  <path d="M88,104 Q82,88 86,70 Q90,55 100,42 Q110,55 114,70 Q118,88 112,104 Z"
        fill="rgba(255,255,255,0.65)"/>
  <!-- Flame tongues left -->
  <path d="M80,90 Q68,80 64,60 Q72,68 78,78 Q72,62 76,44 Q82,58 82,78 Z"
        fill="white" opacity="0.8"/>
  <!-- Flame tongues right -->
  <path d="M120,90 Q132,80 136,60 Q128,68 122,78 Q128,62 124,44 Q118,58 118,78 Z"
        fill="white" opacity="0.8"/>
  <!-- Fire tip / tip glow -->
  <path d="M96,28 Q100,14 104,28 Q102,22 100,20 Q98,22 96,28 Z" fill="white" opacity="0.9"/>
  <!-- Embers / sparks floating up -->
  <circle cx="88" cy="52" r="2.5" fill="white" opacity="0.7"/>
  <circle cx="112" cy="42" r="2" fill="white" opacity="0.65"/>
  <circle cx="78" cy="38" r="1.8" fill="white" opacity="0.6"/>
  <circle cx="122" cy="55" r="2" fill="white" opacity="0.6"/>
  <circle cx="68" cy="22" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="130" cy="28" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="95" cy="14" r="1.5" fill="white" opacity="0.55"/>
  <circle cx="106" cy="10" r="1.2" fill="white" opacity="0.45"/>
  <!-- Light beam from heaven (fire from the Lord) -->
  <path d="M100" cy="0" fill="none"/>
  <line x1="100" y1="0" x2="100" y2="28" stroke="rgba(255,255,255,0.5)" stroke-width="6" opacity="0.4"/>
  <!-- Ground line -->
  <line x1="10" y1="165" x2="190" y2="165" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
</svg>
