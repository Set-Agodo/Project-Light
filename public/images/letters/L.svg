<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Glow behind cross -->
  <circle cx="100" cy="92" r="68" fill="rgba(255,255,255,0.10)"/>
  <!-- Cross -->
  <rect x="88" y="32" width="24" height="120" rx="5" fill="white" opacity="0.93"/>
  <rect x="50" y="66" width="100" height="24" rx="5" fill="white" opacity="0.93"/>
  <!-- Heart centered on cross intersection -->
  <path d="M88,84 Q88,72 100,72 Q112,72 112,84 Q112,96 100,108 Q88,96 88,84 Z" fill="rgba(255,255,255,0.4)"/>
  <!-- Large heart overlaid (outlined) -->
  <path d="M76,76 Q76,58 92,58 Q100,58 100,65 Q100,58 108,58 Q124,58 124,76 Q124,95 100,114 Q76,95 76,76 Z"
        fill="none" stroke="white" stroke-width="3" opacity="0.7"/>
  <!-- Rays outward from cross -->
  <line x1="100" y1="18" x2="100" y2="26" stroke="white" stroke-width="2.5" opacity="0.55"/>
  <line x1="138" y1="28" x2="132" y2="34" stroke="white" stroke-width="2" opacity="0.45"/>
  <line x1="62" y1="28" x2="68" y2="34" stroke="white" stroke-width="2" opacity="0.45"/>
  <line x1="168" y1="78" x2="160" y2="78" stroke="white" stroke-width="2" opacity="0.45"/>
  <line x1="32" y1="78" x2="40" y2="78" stroke="white" stroke-width="2" opacity="0.45"/>
  <!-- Small hearts scattered -->
  <path d="M32,38 Q32,32 37,32 Q42,32 42,38 Q42,44 37,49 Q32,44 32,38 Z" fill="white" opacity="0.5"/>
  <path d="M158,40 Q158,34 163,34 Q168,34 168,40 Q168,46 163,51 Q158,46 158,40 Z" fill="white" opacity="0.5"/>
  <path d="M22,110 Q22,105 26,105 Q30,105 30,110 Q30,115 26,119 Q22,115 22,110 Z" fill="white" opacity="0.4"/>
  <path d="M170,112 Q170,107 174,107 Q178,107 178,112 Q178,117 174,121 Q170,117 170,112 Z" fill="white" opacity="0.4"/>
  <!-- Bottom text-like element (John 3:16 reference) -->
  <line x1="62" y1="162" x2="138" y2="162" stroke="white" stroke-width="2" opacity="0.35"/>
  <line x1="72" y1="170" x2="128" y2="170" stroke="white" stroke-width="1.5" opacity="0.28"/>
</svg>
