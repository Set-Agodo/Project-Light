<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Scroll body (partially unrolled) -->
  <!-- Left rolled end -->
  <ellipse cx="32" cy="100" rx="16" ry="68" fill="white" opacity="0.85"/>
  <!-- Right rolled end -->
  <ellipse cx="168" cy="100" rx="16" ry="68" fill="white" opacity="0.85"/>
  <!-- Flat scroll surface -->
  <rect x="32" y="32" width="136" height="136" fill="white" opacity="0.75"/>
  <!-- Top/bottom scroll edge highlights -->
  <line x1="32" y1="32" x2="168" y2="32" stroke="white" stroke-width="4" opacity="0.9"/>
  <line x1="32" y1="168" x2="168" y2="168" stroke="white" stroke-width="4" opacity="0.9"/>
  <!-- Text lines on scroll -->
  <line x1="55" y1="62" x2="145" y2="62" stroke="rgba(0,0,0,0.18)" stroke-width="2.5"/>
  <line x1="55" y1="76" x2="145" y2="76" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>
  <line x1="55" y1="90" x2="145" y2="90" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>
  <line x1="55" y1="104" x2="145" y2="104" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>
  <line x1="55" y1="118" x2="145" y2="118" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>
  <line x1="55" y1="132" x2="130" y2="132" stroke="rgba(0,0,0,0.12)" stroke-width="2"/>
  <!-- Dove perched on top right of scroll -->
  <!-- Dove body -->
  <ellipse cx="148" cy="24" rx="14" ry="9" fill="white" opacity="0.92"/>
  <!-- Dove head -->
  <circle cx="160" cy="20" r="8" fill="white" opacity="0.92"/>
  <!-- Dove beak -->
  <path d="M166,19 L174,18 L166,22 Z" fill="white" opacity="0.85"/>
  <!-- Dove tail -->
  <path d="M134,24 Q125,18 118,22 Q125,26 134,28 Z" fill="white" opacity="0.88"/>
  <!-- Dove wing -->
  <path d="M148,18 Q145,10 138,12 Q142,16 148,24 Z" fill="rgba(255,255,255,0.6)"/>
  <!-- Olive branch in beak -->
  <path d="M168,19 Q176,14 182,16" fill="none" stroke="white" stroke-width="2" opacity="0.75"/>
  <ellipse cx="178" cy="14" rx="4" ry="3" fill="white" opacity="0.7" transform="rotate(-20 178 14)"/>
  <!-- Glow / light from above -->
  <line x1="100" y1="22" x2="100" y2="10" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="72" y1="28" x2="65" y2="18" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <!-- Gold seal circle at center of scroll -->
  <circle cx="100" cy="100" r="14" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <circle cx="100" cy="100" r="8" fill="rgba(255,255,255,0.35)"/>
</svg>
