  <line x1="100" y1="57" x2="100" y2="10" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <line x1="100" y1="113" x2="100" y2="160" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.65"/>
  <line x1="72" y1="85" x2="16" y2="85" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.65"/>
  <line x1="128" y1="85" x2="184" y2="85" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.65"/>
  <line x1="80" y1="65" x2="45" y2="30" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <line x1="120" y1="65" x2="155" y2="30" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <line x1="80" y1="105" x2="45" y2="140" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  <line x1="120" y1="105" x2="155" y2="140" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
