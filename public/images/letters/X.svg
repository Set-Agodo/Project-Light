  <line x1="72" y1="85" x2="40" y2="72" stroke="white" stroke-width="1.8" opacity="0.35"/>
  <line x1="72" y1="85" x2="40" y2="98" stroke="white" stroke-width="1.8" opacity="0.35"/>
